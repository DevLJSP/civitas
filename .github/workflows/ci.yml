name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Dummy URL: prisma validate parses (never connects to) the datasource.
    # Tests are DB-free by design, so no real database is needed in CI.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civitas
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/civitas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test
